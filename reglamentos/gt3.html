<script>
var REGLAMENTO = {"meta": {"marca": "RESISBARNA", "modelo": "GT3", "subtitulo": "Slot Racing Championship", "etiqueta": "Reglamento Técnico Oficial · Temporada 2026", "creditos": true, "datos": [{"campo": "Versión", "valor": "V1.5"}, {"campo": "Categorías", "valor": "GT3 · Rookies Cup"}, {"campo": "Motor", "valor": "Slot.it Boxer/2"}, {"campo": "Neumático trasero", "valor": "SC4752 AS25"}]}, "secciones": [{"id": "preambulo", "numero": "00", "titulo": "Preámbulo", "bloques": [{"tipo": "texto", "html": "El campeonato se divide en dos categorías, <strong>GT3</strong> y <strong>Rookies Cup</strong>. Ambas comparten el mismo reglamento técnico, pero con clasificaciones separadas para los pilotos en función de su metal."}, {"tipo": "aviso", "estilo": "info", "etiqueta": "Rookies", "html": "La Rookies Cup está reservada a los equipos cuyos pilotos sean <strong>Bronce</strong> o <strong>Plata-Bronce</strong>."}, {"tipo": "texto", "html": "Los modelos homologados serán <strong>GT3, GTLM y GTE</strong> de Scaleauto, Sideways y Slot.it."}, {"tipo": "specs", "items": [{"k": "Marcas homologadas", "v": "Slot.it · Sideways · Scaleauto · Sloting Plus · NSR · Dzero", "small": ""}]}]}, {"id": "homologados", "numero": "01", "titulo": "Modelos homologados · Anexo J", "nav": "Modelos homologados", "bloques": [{"tipo": "texto", "html": "Listado completo de modelos admitidos para 2026 con sus <strong>créditos</strong> y <strong>peso mínimo</strong>. Filtra por marca, ordena por cualquier columna o usa el buscador superior."}, {"tipo": "aviso", "estilo": "info", "etiqueta": "Kit blanco", "html": "Los coches en kit blanco para pintar son más ligeros; en algunos casos deberán lastrarse para llegar al peso mínimo. Se podrán lastrar o eliminar las piezas señaladas en las <a href='#notas'>notas por modelo</a>."}, {"tipo": "MODELOS"}, {"tipo": "aviso", "estilo": "info", "etiqueta": "Black Arrow", "html": "Los <strong>Ferrari 458 GT3</strong> y <strong>Lamborghini Murciélago GT3</strong> de Black Arrow podrán competir con los chasis de Scaleauto específicos para ambos modelos, compatibles con cunas Scaleauto RT3 y Slot.it. Ambos son además comercializados por Scaleauto con las mismas carrocerías."}]}, {"id": "carroceria", "numero": "02", "titulo": "Carrocería", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "De serie, manteniendo <strong>todos los elementos originales</strong> del coche."}, {"estado": "si", "txt": "Se permite <strong>reparar los tetones</strong> mediante tubos de refuerzo o pegamento, sin excesos."}, {"estado": "", "txt": "Habitáculo libre, siempre que tenga <strong>piloto con cabeza, busto, brazos y volante</strong>. Debe ser en 3 dimensiones y pintado en al menos 3 colores, y tapar todos los elementos mecánicos visibles desde el interior."}, {"estado": "si", "txt": "Se permite sustituir las patas del alerón por <strong>soportes de goma</strong>, así como alerones de goma inyectados o impresos en 3D, siempre que sean específicos de cada modelo."}, {"estado": "si", "txt": "Se permite prescindir de <strong>retrovisores, limpias, antenas y aletines frontales</strong>."}, {"estado": "", "txt": "Deben ser modelos <strong>decorados y con un mínimo de 3 dorsales</strong>."}]}]}, {"id": "chasis", "numero": "03", "titulo": "Chasis", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "Original y de serie de cada modelo, o recambio original, en <strong>plástico inyectado</strong>."}, {"estado": "si", "txt": "Se permiten chasis de recambio de <strong>distintas durezas</strong>, siempre que sean en plástico inyectado."}, {"estado": "si", "txt": "Se permite eliminar <strong>rebabas perimetrales</strong>."}, {"estado": "no", "txt": "No se permiten <strong>deformaciones impropias ni modificaciones</strong>."}]}]}, {"id": "bancada", "numero": "04", "titulo": "Bancada de motor", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "De <strong>offset −1,0 mm</strong> únicamente: Scaleauto, Sideways o Slot.it. Las bancadas originales de Sideways se referencian como offset −0,70 mm."}, {"estado": "", "txt": "No se permiten modificaciones, salvo montar o no los brazos laterales. En las bancadas Slot.it y Sideways se permite <strong>cortarlos</strong>."}, {"estado": "", "txt": "La bancada deberá estar <strong>en un mismo plano con el chasis</strong>."}, {"estado": "si", "txt": "Solo se admiten <strong>cojinetes esféricos</strong>, de uno o dos labios, para Slot.it o Sideways."}, {"estado": "si", "txt": "Se admiten los cojinetes excéntricos <strong>Sloting Plus SP051200 de 0,3 mm</strong> para las bancadas de Sideways (0,7 mm)."}, {"estado": "no", "txt": "No se permiten los <strong>rodamientos a bolas</strong>."}]}, {"tipo": "tabla", "cols": ["Referencia", "Marca", "Descripción"], "filas": [["AV20575d", "Avant Slot", "Offset 1.00 mm"], ["SC-6528c", "Scaleauto", "RT3 −1 mm extra hard"], ["SWMAWGT3", "Sideways", "Offset −0,70 mm (negra)"], ["SWMAWGT3H", "Sideways", "Offset −0,70 mm Hard (roja)"], ["CH-82b", "Slot.it", "Hard · cojinetes esféricos (blanca)"], ["CH-82c", "Slot.it", "Carbono · cojinetes esféricos"], ["CH-119b", "Slot.it", "Hard · rodamientos a bolas (blanca)"], ["CH-119c", "Slot.it", "Carbono · rodamientos a bolas"]]}]}, {"id": "llantas", "numero": "05", "titulo": "Llantas", "bloques": [{"tipo": "texto", "html": "Libres dentro de las marcas homologadas."}, {"tipo": "specs", "items": [{"k": "Delanteras · material", "v": "Plástico, impresión 3D, magnesio o aluminio", "small": ""}, {"k": "Delanteras · Ø mínimo", "v": "15,8 mm", "small": ""}, {"k": "Traseras · material", "v": "Magnesio o aluminio", "small": ""}, {"k": "Traseras · ancho mínimo", "v": "8 mm", "small": ""}, {"k": "Traseras · Ø", "v": "16,5 – 17,3 mm", "small": ""}, {"k": "Referencia ejemplo", "v": "W16509715Ma", "small": "16,5 × 9,75 mm (magnesio)"}]}]}, {"id": "neumaticos", "numero": "06", "titulo": "Neumáticos", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "<strong>Delanteros:</strong> libres dentro de las marcas homologadas. Deben cubrir toda la banda de rodadura de la llanta."}, {"estado": "", "txt": "<strong>Traseros:</strong> Scaleauto SC4752 AS25 (19,0)."}]}, {"tipo": "aviso", "estilo": "warn", "etiqueta": "Obligatorio", "html": "Los neumáticos traseros son <strong>entregados por la organización</strong>."}]}, {"id": "transmision", "numero": "07", "titulo": "Transmisión", "bloques": [{"tipo": "texto", "html": "Libre dentro de las marcas homologadas."}, {"tipo": "specs", "items": [{"k": "Piñón · dientes", "v": "12 z", "small": "únicamente"}, {"k": "Piñón · Ø", "v": "6,5 ó 6,75 mm", "small": ""}, {"k": "Piñón · material", "v": "Acero, latón, ergal o nylon", "small": ""}, {"k": "Corona · dientes", "v": "26 z – 30 z", "small": ""}, {"k": "Corona · Ø", "v": "16 mm", "small": "(15,8 mm)"}, {"k": "Corona · material", "v": "Aluminio o nylon", "small": ""}]}, {"tipo": "reglas", "items": [{"estado": "si", "txt": "Se permite el empleo de <strong>separadores</strong> entre la corona y el cojinete."}]}]}, {"id": "ejes", "numero": "08", "titulo": "Ejes", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "Libres dentro de las marcas homologadas: de <strong>acero</strong> o con recubrimiento de <strong>titanio (dorados)</strong>."}, {"estado": "no", "txt": "No se permiten los ejes de <strong>titanio grises ni los de carbono</strong>."}, {"estado": "si", "txt": "Podrán ser <strong>huecos o macizos</strong>."}, {"estado": "", "txt": "El conjunto del tren (eje + llantas) <strong>no podrá sobresalir de la carrocería</strong> en ningún caso."}, {"estado": "si", "txt": "Es <strong>obligatorio el empleo de un «stopper»</strong>, libre dentro de las marcas homologadas, como mínimo en el tren trasero."}]}]}, {"id": "motor", "numero": "09", "titulo": "Motor", "bloques": [{"tipo": "specs", "items": [{"k": "Motor", "v": "Slot.it Boxer/2", "small": "MN08ch"}, {"k": "Montaje", "v": "Ventana orientada hacia arriba", "small": ""}, {"k": "Asignación", "v": "Por sorteo (organización)", "small": ""}, {"k": "RPM máx.", "v": "10.250", "small": ""}, {"k": "Gauss máx.", "v": "5,5", "small": ""}, {"k": "Altura mínima a la galga", "v": "> 0,5 mm", "small": ""}]}, {"tipo": "aviso", "estilo": "warn", "etiqueta": "Prohibido", "html": "Solo se permite engrasarlo en sus cojinetes desde el exterior. <strong>Cualquier tipo de manipulación está expresamente prohibida.</strong>"}, {"tipo": "reglas", "items": [{"estado": "", "txt": "Debe haber <strong>luz entre la galga de medición y el motor</strong> en cualquiera de sus puntos."}, {"estado": "", "txt": "Si no se supera la altura mínima, será <strong>obligatorio sustituir las llantas por unas de mayor diámetro</strong>."}]}]}, {"id": "suspension", "numero": "10", "titulo": "Suspensión", "bloques": [{"tipo": "reglas", "items": [{"estado": "si", "txt": "Se admiten suspensiones de <strong>imanes o muelles</strong>, montables en posición delantera, trasera y lateral."}, {"estado": "", "txt": "La tornillería de la suspensión es libre, siempre que <strong>no implique modificar carrocería, chasis o bancada</strong>."}, {"estado": "si", "txt": "Puentes, soportes y muelles de amortiguación son <strong>libres</strong>. Los imanes son libres dentro de las marcas homologadas."}, {"estado": "", "txt": "La bancada y el chasis deberán permanecer <strong>en el mismo plano en posición de reposo</strong>."}, {"estado": "si", "txt": "Se permiten los sistemas de bloqueo previstos por los fabricantes de la bancada, en los lugares previstos, tanto de recorrido como de regulación externa."}]}]}, {"id": "guia", "numero": "11", "titulo": "Guía, tornillos, cables y trencillas", "nav": "Guía, tornillos y cables", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "<strong>Guía:</strong> libre, debe ser del mismo fabricante del modelo. Se permiten las guías 3D de Scaleauto. Los modelos Sideways podrán usar guías Slot.it, <strong>pero no al revés</strong>."}, {"estado": "si", "txt": "Se permite el uso de <strong>arandelas debajo de la guía</strong> para regular la altura del morro."}, {"estado": "", "txt": "<strong>Tornillería:</strong> libre, siempre que no implique modificar soportes o emplazamientos. Para la suspensión deberá emplearse tornillería específica de suspensión. Se permiten tornillos allen en el chasis para corregir los apoyos de la carrocería."}, {"estado": "", "txt": "<strong>Cables:</strong> libres. Deben conservar toda su funda entre el motor y el eje delantero; se podrán pelar entre la guía y el eje delantero."}, {"estado": "", "txt": "<strong>Trencillas:</strong> libres. El método de fijación a la guía es libre, sin modificar su alojamiento."}]}]}, {"id": "notas", "numero": "12", "titulo": "Notas de preparación por modelo", "nav": "Notas por modelo", "bloques": [{"tipo": "texto", "html": "Aclaraciones y piezas que se permite eliminar o sustituir en cada modelo concreto. En las fotos, las <strong>marcas de color</strong> (círculos, flechas o recuadros) señalan las zonas afectadas. Toca cualquier imagen para ampliarla."}, {"tipo": "NOTAS"}]}, {"id": "changelog", "numero": "13", "titulo": "Historial de versiones", "bloques": [{"tipo": "versiones", "items": [{"v": "V1.1", "txt": "Definido el diámetro mínimo de las llantas delanteras."}, {"v": "V1.2", "txt": "Homologados cojinetes excéntricos Sloting Plus de 0,3. Homologado Ferrari 296 GT3 Avant Slot (+8 créditos)."}]}, {"tipo": "aviso", "estilo": "warn", "etiqueta": "Regla de oro", "html": "Todo lo no especificado en el presente reglamento está <strong>expresamente prohibido</strong>."}]}], "modelos": [{"cred": -8, "model": "Viper SRT", "marca": "Scaleauto", "peso": 17, "note": 4}, {"cred": -8, "model": "Ford GTE", "marca": "Sideways", "peso": 18}, {"cred": -6, "model": "Corvette C7R", "marca": "Scaleauto", "peso": 17, "note": 6}, {"cred": -6, "model": "Corvette Callaway C7 GT-R", "marca": "Scaleauto", "peso": 17, "note": 13}, {"cred": -6, "model": "Lambo Huracán GT3", "marca": "Sideways", "peso": 18, "note": 5}, {"cred": -4, "model": "BMW M8 GTE", "marca": "Scaleauto", "peso": 17, "note": 15}, {"cred": -4, "model": "BMW M6 GT3", "marca": "Sideways", "peso": 18, "note": 7}, {"cred": -2, "model": "Aston Martin GT3", "marca": "Sideways", "peso": 17}, {"cred": 0, "model": "Honda NSX GT3", "marca": "Scaleauto", "peso": 18, "note": 12}, {"cred": 0, "model": "Porsche 911 GT3 RSR (992)", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "Audi R8 LMS GT2", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "Ferrari 458 GT3", "marca": "Scaleauto/BA", "peso": 17}, {"cred": 0, "model": "Lambo Murciélago", "marca": "Scaleauto/BA", "peso": 17}, {"cred": 0, "model": "Lambo Huracán Supertrofeo", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "McLaren 720s GT3", "marca": "Sideways", "peso": 18.5}, {"cred": 2, "model": "Ferrari 296 GT3 \"Fantasy 2\"", "marca": "Sideways", "peso": 19}, {"cred": 2, "model": "Lexus RC F GT3", "marca": "Sideways", "peso": 18}, {"cred": 4, "model": "Porsche 991.2 RSR", "marca": "Scaleauto", "peso": 17, "note": 8}, {"cred": 4, "model": "Mercedes AMG GT3", "marca": "Scaleauto", "peso": 18, "note": 3}, {"cred": 4, "model": "Ferrari 488 GT3 \"Fantasy 1\"", "marca": "Sideways", "peso": 17}, {"cred": 6, "model": "Audi R8 LMS", "marca": "Scaleauto", "peso": 17, "note": 14}, {"cred": 6, "model": "Porsche 991 RSR", "marca": "Scaleauto", "peso": 17, "note": 2}, {"cred": 8, "model": "BMW Z4 GT3", "marca": "Scaleauto", "peso": 17, "note": 1}, {"cred": 8, "model": "Bentley Continental GT3", "marca": "Sideways", "peso": 20, "note": 11}, {"cred": 8, "model": "BMW M4 LMGT3", "marca": "Sideways", "peso": 19}, {"cred": 8, "model": "Ford Mustang GT3", "marca": "Sideways", "peso": 18}, {"cred": 8, "model": "Ferrari 296 GT3", "marca": "Avant Slot", "peso": 17}, {"cred": 8, "model": "Maserati GT3", "marca": "Slot.it", "peso": 17.5, "note": 9}, {"cred": 8, "model": "Nissan GTR GT3", "marca": "Slot.it", "peso": 18, "note": 10}, {"cred": 8, "model": "Audi R8 LMS GT3 EVOII", "marca": "Slot.it", "peso": 17}, {"cred": 10, "model": "Maserati GT4", "marca": "Slot.it", "peso": 18}], "notas": [{"n": 1, "title": "BMW Z4 GT3", "mk": "Scaleauto", "text": "Se permite eliminar los pequeños deflectores delanteros. Es necesario eliminar las rejillas metálicas delantera y trasera de los coches que las traigan de serie. Se podrán usar indistintamente las dos versiones de alerón trasero.", "fotos": ["nota-1-1.jpg"]}, {"n": 2, "title": "Porsche 991 RSR", "mk": "Scaleauto", "text": "Se permite eliminar la rejilla metálica frontal y la trasera (bajo el alerón). Se permite eliminar el aletín interior montado sobre el chasis en la parte trasera. Los tubos de escape son obligatorios.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2021/09/SC-3612-Porsche-991-White-Kit-Assembly-Instructions.pdf", "fotos": ["nota-2-1.jpg"]}, {"n": 3, "title": "Mercedes AMG GT GT3", "mk": "Scaleauto", "text": "Para acercar los coches pintados de serie a 18 g: se permite eliminar las rejillas metálicas verticales tras las ruedas delanteras y traseras, y los tubos de escape laterales. También el fondo plástico de la parrilla frontal (no la parrilla, que debe permanecer). Se permite sustituir el ventilador simulado del fondo de la toma de aire del capó por lexán negro o cinta negra.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2021/09/132_AMG.pdf", "fotos": ["nota-3-1.jpg", "nota-3-2.jpg"]}, {"n": 4, "title": "Viper SRT", "mk": "Scaleauto", "text": "Se permite eliminar la rejilla interior alojada en el chasis y sustituir el alerón por uno impreso en goma 3D correspondiente al modelo.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2021/09/SC-3610-VIPER-SRT-White-kit-Assembly-Instructions.pdf", "fotos": ["nota-4-1.jpg"]}, {"n": 5, "title": "Lamborghini Huracán GT3", "mk": "Sideways", "text": "Se permite eliminar los deflectores delanteros.", "fotos": ["nota-5-1.jpg"]}, {"n": 6, "title": "Corvette C7R", "mk": "Scaleauto", "text": "Se permite eliminar el radiador trasero y su rejilla. Se permite rebajar el deflector interior vertical para que no interfiera con el neumático trasero —solo rebajar su ancho, no eliminarlo ni recortar su longitud.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2021/08/132_C7R.pdf", "fotos": ["nota-6-1.jpg", "nota-6-2.jpg"]}, {"n": 7, "title": "BMW M6 GT3", "mk": "Sideways", "text": "Se permite suprimir los pequeños deflectores frontales y sustituir el fondo de las tomas de aire del capó por lexán para reducir peso. También eliminar los interiores de las tomas de aire traseras que interfieren con la suspensión lateral.", "fotos": ["nota-7-1.jpg", "nota-7-2.jpg"]}, {"n": 8, "title": "Porsche 991.2 RSR", "mk": "Scaleauto", "text": "Se puede prescindir de la rejilla metálica en fotograbado del morro, así como de los deflectores.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2021/08/132-P911.2-Assembly-Instructions.pdf", "fotos": ["nota-8-1.jpg"]}, {"n": 9, "title": "Maserati MC 12 GT3", "mk": "Slot.it", "text": "Se permite eliminar los dos deflectores bajo los faros.", "fotos": ["nota-9-1.jpg"]}, {"n": 10, "title": "Nissan Nismo GTR GT3", "mk": "Slot.it", "text": "Se permite eliminar la bandeja de plástico bajo el capó.", "fotos": ["nota-10-1.jpg"]}, {"n": 11, "title": "Bentley Continental GT3 2018", "mk": "Sideways", "text": "Se permite obviar las aletas de los pasos de rueda delanteros. También eliminar los deflectores bajo los faros.", "fotos": ["nota-11-1.jpg", "nota-11-2.jpg"]}, {"n": 12, "title": "Honda NSX GT3", "mk": "Scaleauto", "text": "Consulta el manual oficial de montaje.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2023/10/MANUAL-NSX.pdf", "fotos": ["nota-12-1.jpg"]}, {"n": 13, "title": "Callaway C7R GT3", "mk": "Scaleauto", "text": "Consulta el manual oficial de montaje.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2024/01/MANUALCALLAWAY.pdf", "fotos": ["nota-13-1.jpg"]}, {"n": 14, "title": "Audi R8 LM GT3 Evo", "mk": "Scaleauto", "text": "Consulta el manual oficial de montaje.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2021/09/132_R8.pdf", "fotos": ["nota-14-1.jpg"]}, {"n": 15, "title": "BMW M8 GTE", "mk": "Scaleauto", "text": "Consulta el manual oficial de montaje.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2024/06/MANUAL-M8.pdf", "fotos": ["nota-15-1.jpg"]}]};
