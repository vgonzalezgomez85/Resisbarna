<script>
var REGLAMENTO = {"meta": {"marca": "GRUPO", "modelo": "C", "subtitulo": "24h Llinars · Club Slot Llinars", "etiqueta": "Reglamento Técnico · Grupo C · Slot.it Ready", "creditos": false, "datos": [{"campo": "Versión", "valor": "V1.7"}, {"campo": "Motor", "valor": "Slot.it Boxer/2 MN08CH"}, {"campo": "Peso mínimo", "valor": "18 g"}, {"campo": "Neumático trasero", "valor": "Slot.it PT1171F22"}]}, "secciones": [{"id": "homologados", "numero": "00", "titulo": "Modelos homologados", "nav": "Modelos homologados", "bloques": [{"tipo": "texto", "html": "Modelos Grupo C admitidos. Todos con un <strong>peso mínimo de carrocería de 18 g</strong>."}, {"tipo": "MODELOS"}]}, {"id": "carroceria", "numero": "01", "titulo": "Carrocería", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "De <strong>serie</strong>, sin modificación alguna. Habitáculo original de cada modelo."}, {"estado": "si", "txt": "Se permiten recambios de cockpit aligerados de nueva referencia."}, {"estado": "no", "txt": "Los habitáculos de <strong>lexán están expresamente prohibidos</strong>."}, {"estado": "", "txt": "Peso mínimo de carrocería <strong>18 g</strong> incluyendo todas las piezas. Los que no lleguen se lastran por el interior a una altura mínima de 5 mm, sin interferir con el chasis."}, {"estado": "si", "txt": "Se admiten los recambios «crashproof» específicos de cada modelo. Las carrocerías white kit deben ir pintadas. Decoración libre."}, {"estado": "si", "txt": "Se permite prescindir de <strong>retrovisores, limpias y ganchos de remolque</strong>, llevar pintadas las tulipas y eliminar el faro interior (bombillas)."}, {"estado": "si", "txt": "Se permite reforzar el soporte del alerón con cinta o pegamento sin alterar su estética ni forma; debe ir en su posición original."}]}]}, {"id": "chasis", "numero": "02", "titulo": "Chasis", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "De <strong>serie</strong>, Evo 4 o Evo 6, con 4 o 6 puntos de anclaje. Debe respetar las medidas y formas originales, sin deformaciones."}, {"estado": "si", "txt": "Solo se permite eliminar las rebabas perimetrales que limiten la basculación de cuna o carrocería."}, {"estado": "", "txt": "Chasis y cuna deben estar <strong>en el mismo plano</strong>."}]}]}, {"id": "soporte", "numero": "03", "titulo": "Soporte motor (cuna)", "nav": "Soporte motor", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "Cuna <strong>anglewinder de offset 0</strong>, negra, de 4 o 6 puntos de apoyo y de estricta serie, apoyada y en el mismo plano que el chasis."}, {"estado": "si", "txt": "Referencias homologadas: <strong>CH61</strong> (hard), <strong>CH76</strong> (medium) y la de fibra de carbono <strong>CH61c</strong>."}, {"estado": "", "txt": "Cojinetes esféricos originales Slot.it CH61 o CH76. Se permite encolarlos sin modificar su posición."}, {"estado": "no", "txt": "La cuna con <strong>rodamientos a bolas está expresamente prohibida</strong>."}]}]}, {"id": "suspension", "numero": "04", "titulo": "Suspensiones", "bloques": [{"tipo": "reglas", "items": [{"estado": "si", "txt": "Libres, de muelles o imanes. Tornillos y muelles de otras marcas, siempre que no impliquen modificar su alojamiento."}, {"estado": "", "txt": "Los puentes o brazos fotograbados de las suspensiones deben ser <strong>Slot.it</strong>; tuercas y copas de amortiguador libres."}, {"estado": "no", "txt": "No se permite mezclar imanes y muelles en un mismo amortiguador."}, {"estado": "si", "txt": "Se permiten suspensiones en los soportes <strong>laterales y traseros</strong>, no en los delanteros."}]}]}, {"id": "neumaticos", "numero": "05", "titulo": "Neumáticos", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "<strong>Delanteros:</strong> obligatoriamente Slot.it PT15, PT19 o PT1214. Se pueden lijar o rebajar manteniéndolos planos."}, {"estado": "no", "txt": "No se permite ningún tratamiento ni barniz."}, {"estado": "", "txt": "<strong>Traseros:</strong> Slot.it PT1171F22."}]}]}, {"id": "llantas", "numero": "06", "titulo": "Llantas", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "<strong>Delanteras:</strong> plástico, aluminio o magnesio, 15,8 × 8 mm. Se permiten separadores que no sobresalgan de la carrocería en plano cenital."}, {"estado": "", "txt": "<strong>Traseras:</strong> aluminio o magnesio, 15,8 × 8 o 15,8 × 10 mm. El conjunto no debe sobresalir de la carrocería (plano cenital)."}, {"estado": "", "txt": "Llantas Slot.it con <strong>tapacubos obligatorios</strong> de diseño Grupo C original (o BBS en su defecto). Se permite eliminar los discos de freno."}, {"estado": "no", "txt": "No se permiten tapacubos planos (4WD) de Slot.it de DTM o LMP."}]}]}, {"id": "tornilleria", "numero": "07", "titulo": "Tornillería", "bloques": [{"tipo": "reglas", "items": [{"estado": "si", "txt": "Libre la de motor, cuna y carrocería, así como la del tren delantero, siempre que sea metálica."}, {"estado": "si", "txt": "Solo se permite tornillería de nylon o metacrilato en los tornillos que sujetan la carrocería."}]}]}, {"id": "transmision", "numero": "08", "titulo": "Transmisión", "bloques": [{"tipo": "specs", "items": [{"k": "Piñón", "v": "12 dientes · 6,5 mm", "small": "PI6512e (ergal) o PS12 (latón)"}, {"k": "Corona", "v": "16 mm Ø · 26 z – 31 z", "small": "aluminio o nylon · GA16xxe / GA16xxPl"}]}, {"tipo": "reglas", "items": [{"estado": "si", "txt": "Se permiten separadores en el tren trasero entre el cojinete y la corona, así como el stopper y el cojinete o cuna."}]}]}, {"id": "ejes", "numero": "09", "titulo": "Ejes y stopper", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "Libres, de <strong>acero</strong>, huecos o macizos."}, {"estado": "no", "txt": "No podrán ser dorados, ni de carbono o titanio."}, {"estado": "si", "txt": "El <strong>stopper</strong> es libre pero obligatorio, de aluminio, al lado contrario de la corona o en el puente central de la cuna."}, {"estado": "si", "txt": "El tren delantero se regula con tornillos allen inferiores o superiores. Se permiten soportes de plástico y cojinetes CH14 o CH56b en los puentes delanteros."}]}]}, {"id": "guia", "numero": "10", "titulo": "Guía, trencillas y cables", "nav": "Guía y cables", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "Guía Slot.it: <strong>CH66, CH26</strong> (negra o gris), <strong>CH10</strong> o <strong>CH85</strong> en todas sus variantes (CH85d)."}, {"estado": "si", "txt": "Se permite lijar la pala de la guía en grosor y profundidad."}, {"estado": "si", "txt": "Trencillas y cables libres. Se pueden pelar los cables desde el tren delantero hasta la guía; la funda debe sobrepasar el eje delantero para evitar cortocircuitos."}]}]}, {"id": "lastre", "numero": "11", "titulo": "Lastre", "bloques": [{"tipo": "reglas", "items": [{"estado": "si", "txt": "Solo se permite lastre en la <strong>carrocería</strong> de los coches que no lleguen al peso mínimo, indicando su ubicación."}, {"estado": "no", "txt": "No se permite lastre en el chasis."}]}]}, {"id": "motor", "numero": "12", "titulo": "Motor", "bloques": [{"tipo": "specs", "items": [{"k": "Motor", "v": "Slot.it Boxer/2", "small": "MN08CH (una ventana)"}, {"k": "Montaje", "v": "Ventana hacia el interior del coche (hacia arriba)", "small": ""}]}]}, {"id": "notas", "numero": "13", "titulo": "Notas de preparación por modelo", "nav": "Notas por modelo", "bloques": [{"tipo": "texto", "html": "Modificaciones permitidas por modelo. Los elementos no especificados son obligatorios; solo se permite eliminar retrovisores, limpias y ganchos de arrastre, y usar recambios ligeros «crashproof». Toca cualquier imagen para ampliarla."}, {"tipo": "NOTAS"}]}, {"id": "general", "numero": "14", "titulo": "Disposiciones generales", "bloques": [{"tipo": "aviso", "estilo": "warn", "etiqueta": "Regla de oro", "html": "Los aspectos no reflejados en el reglamento están <strong>prohibidos</strong>. En caso de duda, prevalece el criterio de la Dirección de Carrera."}, {"tipo": "reglas", "items": [{"estado": "", "txt": "El incumplimiento será motivo de aviso y corrección antes o durante las verificaciones y la prueba; según la gravedad, puede añadirse una penalización."}, {"estado": "", "txt": "Las modificaciones necesarias no incluidas deben comunicarse a la organización para su homologación; de lo contrario no están permitidas."}]}]}], "modelos": [{"model": "Porsche 956c LH", "marca": "Slot.it", "peso": 18, "note": 1, "cred": 0}, {"model": "Porsche 956c KH", "marca": "Slot.it", "peso": 18, "note": 1, "cred": 0}, {"model": "Porsche 962c LH", "marca": "Slot.it", "peso": 18, "note": 1, "cred": 0}, {"model": "Porsche 962c 85", "marca": "Slot.it", "peso": 18, "note": 1, "cred": 0}, {"model": "Porsche 962c KH", "marca": "Slot.it", "peso": 18, "note": 1, "cred": 0}, {"model": "Porsche 962 IMSA", "marca": "Slot.it", "peso": 18, "note": 1, "cred": 0}, {"model": "Porsche 962c 90", "marca": "Slot.it", "peso": 18, "note": 1, "cred": 0}, {"model": "Toyota 88c", "marca": "Slot.it", "peso": 18, "cred": 0}, {"model": "Toyota 86c (Long Tail)", "marca": "Slot.it", "peso": 18, "cred": 0}, {"model": "Mercedes Sauber C9", "marca": "Slot.it", "peso": 18, "note": 2, "cred": 0}, {"model": "Mazda 787B", "marca": "Slot.it", "peso": 18, "note": 3, "cred": 0}, {"model": "Nissan R89C/R90V", "marca": "Slot.it", "peso": 18, "note": 5, "cred": 0}, {"model": "Lancia LC2/84", "marca": "Slot.it", "peso": 18, "note": 6, "cred": 0}, {"model": "Lancia LC2/85", "marca": "Slot.it", "peso": 18, "cred": 0}, {"model": "Jaguar XJR6/XJR9", "marca": "Slot.it", "peso": 18, "note": 4, "cred": 0}, {"model": "Jaguar XJR12", "marca": "Slot.it", "peso": 18, "note": 4, "cred": 0}, {"model": "Jaguar XJR10/11", "marca": "Slot.it", "peso": 18, "note": 7, "cred": 0}], "notas": [{"n": 1, "title": "Porsche 956c / 962c y variantes", "mk": "Slot.it", "text": "En los modelos antiguos, al cambiar el cockpit por el recambio ligero es necesario eliminar los radiadores laterales (van reproducidos sobre la carrocería). En los modelos modernos es obligatorio mantenerlos para no dejar un agujero en el pontón lateral. Se permite eliminar el alerón delantero de las versiones KH que lo incluyan, la rejilla trasera de los Porsche 956 HD, y la pestaña que entorpece el tornillo trasero en las versiones de 956 actualizadas.", "manual": "http://slot.it/Download/Kit_Assembly/Porsche_962_IMSA.pdf", "fotos": ["nota-1-1.jpg", "nota-1-2.jpg", "nota-1-3.jpg", "nota-1-4.jpg"]}, {"n": 2, "title": "Mercedes Sauber C9", "mk": "Slot.it", "text": "Es obligatorio mantener los detalles delanteros del chasis Evo 6. Se permite eliminar los tubos de escape (en carrocería o chasis) y el depósito de aceite bajo el alerón, que impiden montar las suspensiones laterales y traseras. También limar por el interior las partes más bajas de las tomas de aire traseras delante del alerón. El alerón debe conservar toda su estructura.", "manual": "http://slot.it/Download/Kit_Assembly/Sauber_C9.pdf", "fotos": ["nota-2-1.jpg", "nota-2-2.jpg", "nota-2-3.jpg", "nota-2-4.jpg"]}, {"n": 3, "title": "Mazda 787B", "mk": "Slot.it", "text": "Existen dos carrocerías con laterales distintos según el chasis (Evo 4 y Evo 6). Debe respetarse la paridad carrocería-chasis. El recambio de chasis Evo 6 incluye los laterales propios. Se permite limar la carrocería Evo 4 para adaptarle el chasis Evo 6, sin excesos ni chapuzas (a juicio del verificador).", "fotos": ["nota-3-1.jpg", "nota-3-2.jpg", "nota-3-3.jpg"]}, {"n": 4, "title": "Jaguar XJR6 / XJR9 / XJR12", "mk": "Slot.it", "text": "Se permite eliminar el carenado de las ruedas traseras y limar sus anclajes para que no molesten con los neumáticos. En los XJR9 se permite eliminar el panel lateral interior, los trapecios de suspensión traseros y el motor simulado superior. La toma de aire del freno sobre la corona puede eliminarse o limarse. Los tubos de escape deben permanecer (se pueden encolar al alerón). Se permite eliminar el spoiler delantero del XJR12 en fotograbado.", "fotos": ["nota-4-1.jpg", "nota-4-2.jpg", "nota-4-3.jpg"]}, {"n": 5, "title": "Nissan R89C / R90V", "mk": "Slot.it", "text": "Se permite eliminar el carenado de las ruedas traseras y las derivas aerodinámicas interiores de los laterales con los escapes que impiden el uso de amortiguadores laterales.", "manual": "http://slot.it/Download/Kit_Assembly/Nissan_R89C.pdf", "fotos": ["nota-5-1.jpg", "nota-5-2.jpg"]}, {"n": 6, "title": "Lancia LC2 1984", "mk": "Slot.it", "text": "Se permite eliminar la tapa del radiador delantero (en posición horizontal), las derivas verticales sobre los faros delanteros y el alerón delantero en las versiones que lo incorporen.", "manual": "http://slot.it/Download/Kit_Assembly/Lancia_LC2_84.pdf", "fotos": ["nota-6-1.jpg", "nota-6-2.jpg"]}, {"n": 7, "title": "Jaguar XJR10", "mk": "Slot.it", "text": "Se permite eliminar las suspensiones simuladas traseras y el radiador derecho que impide el correcto desempeño de la suspensión. También los carenados de las ruedas traseras y la pieza que cubre los huecos sobre el capó motor (no incluida en muchos recambios).", "manual": "http://slot.it/wp-content/uploads/2022/12/XJR10.pdf", "fotos": ["nota-7-1.jpg", "nota-7-2.jpg", "nota-7-3.jpg"]}]};
var NOTE_IMGS  = {"1": ["../assets/reglamentos/notas/grupo-c/nota-1-1.jpg", "../assets/reglamentos/notas/grupo-c/nota-1-2.jpg", "../assets/reglamentos/notas/grupo-c/nota-1-3.jpg", "../assets/reglamentos/notas/grupo-c/nota-1-4.jpg"], "2": ["../assets/reglamentos/notas/grupo-c/nota-2-1.jpg", "../assets/reglamentos/notas/grupo-c/nota-2-2.jpg", "../assets/reglamentos/notas/grupo-c/nota-2-3.jpg", "../assets/reglamentos/notas/grupo-c/nota-2-4.jpg"], "3": ["../assets/reglamentos/notas/grupo-c/nota-3-1.jpg", "../assets/reglamentos/notas/grupo-c/nota-3-2.jpg", "../assets/reglamentos/notas/grupo-c/nota-3-3.jpg"], "4": ["../assets/reglamentos/notas/grupo-c/nota-4-1.jpg", "../assets/reglamentos/notas/grupo-c/nota-4-2.jpg", "../assets/reglamentos/notas/grupo-c/nota-4-3.jpg"], "5": ["../assets/reglamentos/notas/grupo-c/nota-5-1.jpg", "../assets/reglamentos/notas/grupo-c/nota-5-2.jpg"], "6": ["../assets/reglamentos/notas/grupo-c/nota-6-1.jpg", "../assets/reglamentos/notas/grupo-c/nota-6-2.jpg"], "7": ["../assets/reglamentos/notas/grupo-c/nota-7-1.jpg", "../assets/reglamentos/notas/grupo-c/nota-7-2.jpg", "../assets/reglamentos/notas/grupo-c/nota-7-3.jpg"]};
