<script>
var REGLAMENTO = {"meta": {"marca": "RESISBARNA", "modelo": "LMP·HYP·GT3", "subtitulo": "Slot Racing Championship", "etiqueta": "Reglamento Técnico · LMP · Hypercars · LMDH", "creditos": false, "datos": [{"campo": "Versión", "valor": "V2.2"}, {"campo": "Categoría", "valor": "LMP / Hypercars / LMDH / GT3"}, {"campo": "Motor", "valor": "Flat 6s MN13ch"}, {"campo": "Neumático trasero", "valor": "SC 4752 AS25 19,0"}]}, "secciones": [{"id": "campeonato", "numero": "00", "titulo": "Campeonato", "bloques": [{"tipo": "texto", "html": "Campeonato de Barcelona de resistencia por equipos para coches de slot categoría <strong>LMP / Hypercars / LMDH</strong> a escala 1/32."}, {"tipo": "texto", "html": "Se homologan los modelos de las marcas <strong>Black Arrow, Scaleauto, Sideways, NSR, SRC, Sloting Plus y Slot.it</strong>."}]}, {"id": "homologados", "numero": "01", "titulo": "Modelos homologados", "nav": "Modelos homologados", "bloques": [{"tipo": "texto", "html": "Modelos LMP / Hypercars / LMDH admitidos, con su <strong>peso mínimo</strong> de carrocería."}, {"tipo": "MODELOS"}]}, {"id": "lmp2", "numero": "02", "titulo": "LMP2", "nav": "LMP2", "bloques": [{"tipo": "texto", "html": "Categoría <strong>LMP2</strong> de especificación cerrada dentro del campeonato. Solo se admiten los modelos <strong>Oreca 07</strong> y <strong>Acura ARX-05</strong>, ambos de <strong>Slot.it</strong>."}, {"tipo": "specs", "items": [{"k": "Modelos admitidos", "v": "Oreca 07 y Acura ARX-05 (Slot.it)"}, {"k": "Peso carrocería", "v": "17,0 g", "small": "mínimo, igual que el resto de LMP"}, {"k": "Bancada", "v": "Offset −1", "small": "solo la versión de cojinetes esféricos y de rodamientos"}, {"k": "Llanta delantera", "v": "17,3 mm", "small": "fija"}, {"k": "Llanta trasera", "v": "17,3 mm", "small": "fija"}, {"k": "Piñón", "v": "Libre", "small": "como en el resto de LMP"}, {"k": "Corona", "v": "Libre", "small": "como en el resto de LMP"}, {"k": "Motor", "v": "Flat 6 amarillo"}, {"k": "Chasis", "v": "Original de inyección de plástico", "small": "no se admiten otros"}]}, {"tipo": "aviso", "estilo": "warn", "etiqueta": "Especificación cerrada", "html": "En LMP2 no aplican las libertades de bancada, llantas, motor y chasis del resto de la categoría LMP/Hypercar: estos elementos son <strong>obligatorios y fijos</strong>, sin excepciones. El piñón y la corona sí son libres, como en el resto de LMP."}]}, {"id": "mandos", "numero": "03", "titulo": "Mandos", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "Conexión mediante «bananas», según las normas particulares de cada carrera."}, {"estado": "si", "txt": "Se admite todo tipo de mando del mercado, incluidos los <strong>electrónicos</strong>, siempre que no potencien la corriente ni afecten al sentido de giro del motor."}, {"estado": "no", "txt": "No se admiten mandos caseros ni con modificaciones no contempladas por el fabricante."}, {"estado": "", "txt": "La Dirección de Carrera podrá verificar los mandos en cualquier momento."}]}]}, {"id": "motor", "numero": "04", "titulo": "Motor", "bloques": [{"tipo": "specs", "items": [{"k": "Motores", "v": "Slot.it Flat 6s MN13ch", "small": ""}, {"k": "LMP", "v": "Flat 6s", "small": ""}, {"k": "Asignación", "v": "Motor propio", "small": ""}]}, {"tipo": "tabla", "cols": ["Motor", "RPM máx.", "Gauss máx."], "filas": [["Flat 6 naranja (LMP)", "10.500", "4,5"], ["Flat 6 amarillo (LMP2)", "9.500", "4,5"], ["Boxer/2 (GT3)", "10.250", "5,5"]]}, {"tipo": "aviso", "estilo": "warn", "etiqueta": "Importante", "html": "Los motores serán propios, (sólo modelos permitidos por la organización), cada piloto podrá llevar su motor, pero éste será verificado por la organización y deberá cumplir unos máximos de RPM y GAUS.\n"}, {"tipo": "reglas", "items": [{"estado": "no", "txt": "No está permitido el uso de líquidos que potencien las r.p.m."}, {"estado": "si", "txt": "Solo se acepta el uso de aceites específicos para el engrase del eje."}]}]}, {"id": "carroceria", "numero": "05", "titulo": "Carrocería", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "De <strong>plástico rígido inyectado</strong>, con cristales y faros. Buen aspecto general, sin roturas, con todos sus elementos y sin modificaciones."}, {"estado": "si", "txt": "Se permite eliminar rebabas sin excesos y prescindir de <strong>antenas, retrovisores y limpiaparabrisas</strong>."}, {"estado": "", "txt": "El <strong>alerón</strong> debe estar siempre, en su posición y altura original. Se permite reforzar sus sujeciones con cinta o cola, darle flexibilidad o sustituirlas por piezas más flexibles."}, {"estado": "si", "txt": "<strong>Cockpit</strong> libre (original, de lexán o casero) que cubra el habitáculo, con piloto 3D (volante, brazos, busto y cabeza). Los no originales, pintados en al menos 3 colores."}, {"estado": "", "txt": "Las carrocerías en kit o recambio deben ir <strong>pintadas o barnizadas</strong> obligatoriamente. No se admite el plástico en crudo ni carrocerías transparentes."}, {"estado": "si", "txt": "Tulipas, cristales de faros y rejillas presentes al inicio. En ciertos modelos se permite eliminar rejillas concretas (ver notas)."}, {"estado": "si", "txt": "Se permite reforzar/reparar los tetones y, en Scaleauto, recortar los aletines de apoyo interiores."}, {"estado": "si", "txt": "Las carrocerías de LMP/Hypercar de dos piezas atornilladas pueden ir «sueltas», con holgura, reposando en su posición original."}]}]}, {"id": "chasis", "numero": "06", "titulo": "Chasis", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "De estricta serie (con el coche o como recambio), en <strong>plástico inyectado o impresión 3D</strong> comercializado por marcas de slot. Cada chasis para su carrocería."}, {"estado": "si", "txt": "Se permite eliminar rebabas sin modificar las medidas perimetrales. Los RT3 de Scaleauto pueden intercambiar piezas de distintas durezas."}, {"estado": "no", "txt": "No se permite sujetar ni reforzar piezas con cola u otro sistema, salvo que lo prevea el fabricante."}, {"estado": "no", "txt": "El <strong>lastre en el chasis no está admitido</strong>."}]}, {"tipo": "aviso", "estilo": "info", "etiqueta": "Altura mínima", "html": "Se mide con una galga de ~0,5 mm; debe pasar luz entre la galga y el motor. Los modelos <strong>LMP/Hypercar/LMDH quedan exentos de altura mínima</strong>, aunque la organización puede exigirla para evitar deterioro de la pista."}]}, {"id": "bancadas", "numero": "07", "titulo": "Bancadas", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "Admitidas las bancadas en ángulo de <strong>Slot.it, Scaleauto, Sideways, Black Arrow, SRC y NSR</strong>."}, {"estado": "si", "txt": "En LMP se permiten las bancadas de <strong>offset variable</strong> de Scaleauto y SRC, y las de offset 1,25 de Slot.it."}, {"estado": "si", "txt": "En LMP-Hypercar/LMDH se admiten las bancadas para rodamientos y los <strong>rodamientos a bolas</strong>."}, {"estado": "si", "txt": "Se permite encolar los cojinetes en su alojamiento, sin modificar su asiento y sin excesos de cola."}]}, {"tipo": "texto", "html": "Las bancadas RT4 (verdes) de Scaleauto se admiten con sus chasis 3D (versiones de offset fijo de 1 mm). Kits de extensión Scaleauto admitidos: SC 6538 (RT3) y SC 6539b (RT4 long)."}]}, {"id": "suspension", "numero": "08", "titulo": "Amortiguación", "bloques": [{"tipo": "reglas", "items": [{"estado": "si", "txt": "Se aceptan todos los sistemas de suspensión comercializados por marcas de slot, en sus emplazamientos lógicos (tornillos de bancada y soportes del chasis)."}, {"estado": "si", "txt": "Pueden combinarse componentes de distintas marcas y tipos."}, {"estado": "", "txt": "El sistema debe ser <strong>simétrico</strong> a ambos lados del eje."}, {"estado": "si", "txt": "Tornillos de suspensión libres, siempre que sean específicos de suspensión y no impliquen modificar la bancada en sus soportes."}]}]}, {"id": "neumaticos", "numero": "09", "titulo": "Neumáticos", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "<strong>Delanteros:</strong> libres dentro de las marcas de slot, de goma negra, cubriendo toda la banda de rodadura."}, {"estado": "", "txt": "<strong>Traseros (LMP/Hypercar/LMDH):</strong> Scaleauto SC 4752 AS25 de 19,0×10,5."}]}, {"tipo": "aviso", "estilo": "warn", "etiqueta": "Obligatorio", "html": "Los neumáticos traseros los proporciona la organización antes de cada carrera. Se pueden limpiar con alcohol/gasolina de la organización y deben entregarse secos. Solo 1 juego por carrera."}, {"tipo": "reglas", "items": [{"estado": "", "txt": "Una vez montados, no deben sobresalir del paso de rueda."}]}]}, {"id": "llantas", "numero": "10", "titulo": "Llantas", "bloques": [{"tipo": "texto", "html": "Libres, comercializadas por cualquier marca de slot: plástico, 3D, aluminio o magnesio."}, {"tipo": "specs", "items": [{"k": "Delanteras · Ø mínimo", "v": "15,8 mm", "small": ""}, {"k": "Delanteras · ancho mínimo", "v": "8,5 mm", "small": ""}, {"k": "Traseras · Ø", "v": "15,8 – 17,5 mm", "small": ""}, {"k": "Traseras · ancho mínimo", "v": "8,5 mm", "small": ""}]}, {"tipo": "reglas", "items": [{"estado": "", "txt": "Las llantas de fondo plano no aligeradas (Scaleauto, Slot.it) deben llevar <strong>tapacubos</strong>, libres, bien fijados."}]}]}, {"id": "ejes", "numero": "11", "titulo": "Ejes, centradores y separadores", "nav": "Ejes y separadores", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "Solo ejes metálicos de marcas de slot: <strong>acero o titanio</strong>."}, {"estado": "si", "txt": "Los <strong>LMP/Hypercar/LMDH pueden usar carbono en el tren delantero</strong>."}, {"estado": "no", "txt": "En ningún caso los ejes pueden sobresalir del conjunto llanta-neumático."}, {"estado": "si", "txt": "Se admiten todos los sistemas de bloqueo del tren trasero, incluidos los «stoppers»."}, {"estado": "si", "txt": "Se permite el empleo de separadores en tren delantero y trasero."}, {"estado": "", "txt": "El tren delantero no podrá medir menos de 1 mm por cada lado de los pasos de rueda."}]}]}, {"id": "cojinetes", "numero": "12", "titulo": "Cojinetes", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "De cualquier marca de slot, siempre que no impliquen modificar el alojamiento de la bancada."}, {"estado": "si", "txt": "Se admiten cojinetes excéntricos en las bancadas NSR de serie (no en Sideways)."}, {"estado": "si", "txt": "Se admiten los <strong>rodamientos a bolas</strong> de cualquier fabricante para los LMP-Hypercar/LMDH."}]}]}, {"id": "transmision", "numero": "13", "titulo": "Transmisión, piñones y coronas", "nav": "Transmisión", "bloques": [{"tipo": "texto", "html": "Se admiten todas las transmisiones comercializadas por marcas de slot."}, {"tipo": "reglas", "items": [{"estado": "si", "txt": "En LMP el <strong>piñón es libre</strong> en número de dientes y diámetro, siempre que no implique modificar la bancada o el alojamiento del motor."}, {"estado": "si", "txt": "Las <strong>coronas en LMP son libres</strong> en número de dientes y diámetro, con la misma condición."}]}]}, {"id": "cables", "numero": "14", "titulo": "Cables y trencillas", "bloques": [{"tipo": "reglas", "items": [{"estado": "si", "txt": "Cables libres de cualquier marca de slot. Deben conservar su funda; entre la guía y el tren delantero se puede eliminar para facilitar el retorno de la guía (la funda debe sobrepasar el eje delantero)."}, {"estado": "si", "txt": "Se pueden pegar los cables al chasis con cinta o cola, sin excesos."}, {"estado": "si", "txt": "Trencillas libres, limpias y secas en la verificación. Se permite limpiarlas en parque cerrado con los productos de la organización."}]}]}, {"id": "guia", "numero": "15", "titulo": "Guía", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "De la marca del fabricante del coche, como norma general. Se admiten guías de recambio del fabricante sin modificar el alojamiento del chasis."}, {"estado": "si", "txt": "Se admite el uso de arandelas o muelles de suspensión específicos de guía en los fabricantes que lo prevean."}, {"estado": "si", "txt": "Solo se permite reducir el grosor de la pala o su profundidad, y cortar el vástago para ajustar el recorrido vertical en guías de tornillo."}, {"estado": "", "txt": "Los chasis 3D llevarán la guía del fabricante del chasis si la tuviera; si no, cualquier guía de slot que no modifique el anclaje original."}]}]}, {"id": "tornilleria", "numero": "16", "titulo": "Tornillería", "bloques": [{"tipo": "reglas", "items": [{"estado": "si", "txt": "Libre, de cualquier marca de slot: plástico, hierro, latón, aluminio o titanio."}, {"estado": "si", "txt": "Se permiten arandelas para limitar el movimiento de los tornillos en sus alojamientos, sin sobresalir por la parte inferior del chasis."}]}]}, {"id": "iman", "numero": "17", "titulo": "Imán", "bloques": [{"tipo": "aviso", "estilo": "warn", "etiqueta": "Prohibido", "html": "El imán está <strong>prohibido</strong>. Solo se admiten los imanes del propio motor o los indicados para las suspensiones magnéticas de Slot.it."}]}, {"id": "notas", "numero": "18", "titulo": "Notas de preparación por modelo", "nav": "Notas por modelo", "bloques": [{"tipo": "texto", "html": "Aclaraciones y piezas que se permite eliminar o sustituir en cada modelo LMP. Toca cualquier imagen para ampliarla."}, {"tipo": "NOTAS"}]}, {"id": "otros", "numero": "19", "titulo": "Homologaciones y disposiciones", "nav": "Homologaciones", "bloques": [{"tipo": "reglas", "items": [{"estado": "", "txt": "Quedan homologados los coches, chasis y bancadas especificados a fecha 01/01/2024. Periodos de homologación: 1 de enero, 1 de abril y 1 de septiembre."}, {"estado": "", "txt": "Los elementos no especificados en un modelo son de obligada presencia en las verificaciones."}, {"estado": "si", "txt": "Se permite eliminar antenas, retrovisores y limpias en los coches que los monten de serie."}, {"estado": "si", "txt": "Se admiten réplicas del alerón original en goma 3D o fibra de carbono, en su posición y altura original."}]}, {"tipo": "aviso", "estilo": "warn", "etiqueta": "Regla de oro", "html": "Toda modificación no prevista por el reglamento está <strong>prohibida y se considerará ilegal</strong>. En caso de duda prevalece el criterio de la organización."}]}], "modelos": [{"cred": -8, "model": "Lola B09/12", "marca": "Slot.it", "peso": 17, "note": 3}, {"cred": -8, "model": "Toyota TS-050", "marca": "SRC", "peso": 17, "note": 8}, {"cred": -8, "model": "Porsche 963", "marca": "Scaleauto", "peso": 17, "note": 6}, {"cred": -4, "model": "Lola Aston Martin", "marca": "Slot.it", "peso": 17, "note": 4}, {"cred": 0, "model": "Oreca 07", "marca": "Slot.it", "peso": 17}, {"cred": 0, "model": "Porsche 919", "marca": "SRC", "peso": 17}, {"cred": 2, "model": "Audi R18 Ultra", "marca": "Slot.it", "peso": 17, "note": 2}, {"cred": 6, "model": "Audi R8 LMP", "marca": "Slot.it", "peso": 17, "note": 5}, {"cred": 8, "model": "Audi e-tron Quattro", "marca": "Slot.it", "peso": 17, "note": 2}, {"cred": 8, "model": "Audi R18 Ultra", "marca": "NSR", "peso": 17, "note": 2}, {"cred": 0, "model": "AM Valkyrie", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "McL Hypercar", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "Magma Racing GMR-01", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "G-499", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "A-424 LMH (Alpine)", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "SC-63", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "9x8 LMH (Peugeot)", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "M-Hybrid GTP (BMW)", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "V-Series LMdH (Cadillac)", "marca": "Scaleauto", "peso": 17}, {"cred": 0, "model": "Toyota GR010", "marca": "Slot.it", "peso": 17}, {"cred": 0, "model": "Acura ARX-05", "marca": "Slot.it", "peso": 17}, {"cred": 0, "model": "Ferrari 499P", "marca": "NSR", "peso": 17}, {"cred": 0, "model": "Valkyrie AMR", "marca": "Slot.it", "peso": 17}], "notas": [{"n": 1, "title": "Radical SR-9", "mk": "Scaleauto", "text": "Se permite eliminar los deflectores delanteros bajo los faros. Se permite eliminar el entrante de la entrada de aire lateral trasera de las carrocerías antiguas para poder montar la suspensión lateral con los chasis Evo-6 del Radical. Se permite también prescindir de las tapas laterales que van encoladas bajo las tomas de aire laterales.", "fotos": ["nota-1-1.jpg", "nota-1-2.jpg"]}, {"n": 2, "title": "Audi R18 TDI y e-tron", "mk": "Slot.it / NSR", "text": "Se permite eliminar el aletín bajo el faro delantero.", "manual": "https://slot.it/Download/Kit_Assembly/Audi_R18_e-tron.pdf", "fotos": ["nota-2-1.jpg"]}, {"n": 3, "title": "Lola B09/12", "mk": "Slot.it", "text": "Se permite eliminar las dos rejillas que cubren la salida del paso de rueda trasero en los Lola que lo incorporen de serie. También se permite eliminar las tapas horizontales bajo el alerón. Es posible suprimir las calandras interiores de los faros delanteros en caso de ir las tulipas pintadas.", "manual": "https://slot.it/Download/Kit_Assembly/Lola_B09.pdf", "fotos": ["nota-3-1.jpg", "nota-3-2.jpg"]}, {"n": 4, "title": "Lola Aston Martin DBR1-2", "mk": "Slot.it", "text": "Consulta el manual oficial de montaje para los detalles de este modelo.", "manual": "https://slot.it/Download/Kit_Assembly/Body_Aston_DBR1-2.pdf", "fotos": ["nota-4-1.jpg"]}, {"n": 5, "title": "Audi R8 LMP", "mk": "Slot.it", "text": "Consulta el manual oficial de montaje para los detalles de este modelo.", "manual": "https://slot.it/Download/Kit_Assembly/Body_R8LMP_2000.pdf", "fotos": ["nota-5-1.jpg"]}, {"n": 6, "title": "Porsche 963", "mk": "Scaleauto", "text": "Consulta el manual oficial de montaje para los detalles de este modelo.", "manual": "https://scaleauto-slot.com/wp-content/uploads/2023/07/MANUAL-P963.pdf", "fotos": ["nota-6-1.jpg"]}, {"n": 8, "title": "Toyota TS 050", "mk": "SRC", "text": "Se permite eliminar la rejilla trasera bajo el alerón.", "fotos": ["nota-8-1.jpg"]}]};
